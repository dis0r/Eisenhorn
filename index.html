<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EISENHORN">
<meta name="theme-color" content="#0E0F11">
<title>EISENHORN Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0E0F11; --sur:#131518; --sur2:#17191C; --line:#1F2326; --line2:#2C3135;
  --fg:#F4F5F6; --fg2:#DDE0E2; --dim:#8C9296; --dim2:#6B7074; --dim3:#4E5458;
  --acc:#3B6BE8; --accfg:#EAF0FF; --up:#4FD1C5;
  --cond:'Barlow Condensed','Helvetica Neue Condensed','Arial Narrow',system-ui,sans-serif;
  --body:Barlow,'Helvetica Neue',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{color:#5C86F5}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--top) + 14px) 0 calc(var(--bot) + 96px)}
.pad{padding:0 22px}.pad2{padding:18px 16px 16px}

.eyebrow{font:600 11px/1 var(--cond);letter-spacing:.24em;text-transform:uppercase;color:#5F6569}
.hero{font:700 40px/.95 var(--cond);text-transform:uppercase;margin:8px 0 0;letter-spacing:-.01em}
.h1{font:700 34px/1 var(--cond);text-transform:uppercase;margin:0}
.titlerow{display:flex;align-items:baseline;justify-content:space-between}
.lead{font:400 14px/1.45 var(--body);color:var(--dim);margin:8px 0 0}
.mono{font:500 11px/1 var(--mono);color:#5F6569}.dim{color:var(--dim2)}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;padding:24px 22px 9px;
  font:600 11px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--dim2)}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#1D2023;margin:22px 22px 0;border:1px solid #1D2023}
.stats.two{grid-template-columns:1fr 1fr;margin-top:16px}
.stat{background:var(--sur);padding:12px}
.stat b{display:block;font:700 26px/1 var(--cond)}.stat b.acc{color:var(--acc)}
.stat i{display:block;font:500 10px/1.2 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin-top:5px;font-style:normal}

.seg3{display:flex;gap:1px;background:#1D2023;margin:0 22px;border:1px solid #1D2023}
.seg3.flat{margin:0 0 2px}
.s3{flex:1;background:var(--sur);padding:12px 6px;text-align:center;cursor:pointer;min-height:48px}
.s3.on{background:#1A2540}
.s3 b{display:block;font:700 14px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.s3.on b{color:var(--accfg)}
.s3 i{display:block;font:500 10px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--dim3);margin-top:6px;font-style:normal}
.s3.on i{color:var(--acc)}

.card{margin:14px 22px 0;border:1px solid #24282B;background:linear-gradient(160deg,var(--sur2),#111315)}
.cardtop{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.dot{width:6px;height:6px;background:var(--acc);border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.tag{font:600 10px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.ml{margin-left:auto}
.ctitle{padding:8px 16px 0;font:700 27px/1.05 var(--cond);text-transform:uppercase}
.csub{padding:6px 16px 0;font:400 14px/1.45 var(--body);color:var(--dim)}
.plan{display:flex;flex-direction:column;gap:1px;margin-top:14px;background:#22262A}
.prow{display:flex;align-items:center;gap:12px;background:#131518;padding:12px 16px;cursor:pointer;min-height:44px}
.num{font:600 11px/1 var(--mono);color:var(--dim3);width:22px}
.pname{flex:1;font:500 15px/1.2 var(--body);color:var(--fg2)}
.pload{font:600 12px/1 var(--cond);letter-spacing:.06em;color:var(--acc);white-space:nowrap}

.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--acc);color:var(--accfg);
  min-height:54px;padding:16px 18px;cursor:pointer;font:700 16px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase}
.cta:active{background:#5C86F5}
.ghost{display:flex;align-items:center;justify-content:center;min-height:50px;border:1px solid var(--line2);
  color:var(--fg2);cursor:pointer;font:600 13px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;margin:14px 0}

.hscroll{display:flex;gap:10px;padding:0 22px;overflow-x:auto}
.gcard{flex:none;width:150px;border:1px solid #24282B;background:var(--sur);padding:12px;cursor:pointer}
.gname{font:500 13px/1.25 var(--body);color:#C9CDD0;height:34px;overflow:hidden}
.grow{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.grow b{font:700 22px/1 var(--cond)}
.grow i{font:600 11px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);font-style:normal}
.grow u{margin-left:auto;font:600 12px/1 var(--body);color:var(--up);text-decoration:none}
.gkg{font:500 12px/1 var(--mono);color:var(--acc);margin-top:6px}

.search{display:flex;align-items:center;gap:9px;margin-top:12px;background:var(--sur2);border:1px solid #24282B;padding:0 12px;height:46px}
.search span{color:#5F6569}
.search input{flex:1;background:none;border:0;outline:0;color:#E8EAEB;font:400 16px/1 var(--body);height:46px}
.rfilter{display:flex;gap:6px;margin-top:11px}
.rc{flex:1;padding:10px 4px;text-align:center;border:1px solid var(--line2);color:var(--dim);cursor:pointer;
  font:600 10px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase}
.rc.on{background:#1A2540;border-color:var(--acc);color:var(--accfg)}
.chips{display:flex;gap:7px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:8px 12px;border:1px solid var(--line2);color:var(--dim);cursor:pointer;
  font:600 11px/1 var(--cond);letter-spacing:.13em;text-transform:uppercase}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg)}

.list{margin-top:14px}
.erow{display:flex;gap:13px;padding:11px 22px;cursor:pointer;border-bottom:1px solid #1A1D20;align-items:center;min-height:60px}
.thumb{flex:none;width:60px;height:60px;position:relative;overflow:hidden;border:1px solid #24282B;
  background:repeating-linear-gradient(115deg,#1B1E21 0 6px,#16191B 6px 12px)}
.scan{position:absolute;left:0;right:0;height:26px;background:linear-gradient(180deg,transparent,rgba(59,107,232,.18),transparent);animation:scan 3.4s linear infinite}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(400%)}}
.ebody{flex:1;min-width:0}
.ename{font:500 16px/1.2 var(--body);color:#E4E7E9}
.dsflag{font:600 9px/1 var(--mono);color:var(--acc);border:1px solid var(--acc);padding:2px 4px;vertical-align:middle}
.emeta{font:500 12px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin-top:6px}
.eright{text-align:right;flex:none}
.eright b{display:block;font:700 17px/1 var(--cond);color:var(--acc);white-space:nowrap}
.eright i{display:block;font:500 10px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:#5F6569;margin-top:4px;font-style:normal}
.eright i.up{color:var(--up);font-size:12px;letter-spacing:0}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;width:64px}
.spark div{flex:1;background:#2B3034}.spark div.on{background:var(--acc)}

.hero-media{position:relative}
.media{position:relative;overflow:hidden;background:repeating-linear-gradient(115deg,#1B1E21 0 9px,#16191B 9px 18px);border-bottom:1px solid #24282B}
.media img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2}
.media.novid img{display:none}
.media .schema,.media .mlabel{display:none}
.media.novid .schema{display:block;position:absolute;inset:0;padding:10px}
.media.novid .schema svg{width:100%;height:100%}
.media.novid .mlabel{display:block;position:absolute;right:12px;top:12px;z-index:4;
  font:600 9px/1 var(--mono);color:#4E5458;letter-spacing:.14em;text-transform:uppercase}
.sl{animation:sl 2.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sl{0%,8%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}
.sl.rot{transform-origin:26px 101px;animation:slr 2.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes slr{0%,8%{transform:rotate(0)}50%{transform:rotate(-26deg)}92%,100%{transform:rotate(0)}}

.skala{margin-top:14px;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:12px;background:#111315;padding:12px 14px;min-height:48px}
.srow .mname{flex:1;min-width:0;font:600 16px/1.2 var(--body);color:var(--fg2)}
.srow .pips{flex:none;display:flex;gap:4px}
.srow .pip{width:9px;height:9px;background:#2B3034;border-radius:50%}
.srow .pip.on{background:var(--acc)}
.srow .rank{flex:none;width:26px;text-align:right;font:600 11px/1 var(--mono);color:var(--dim3)}
.srclink{display:block;margin-top:12px;font:500 12px/1 var(--body)}
.mset{display:flex;gap:3px;margin-top:7px}
.mset span{height:3px;background:#2B3034}
.mset span:first-child{background:var(--acc)}

.acc{border-bottom:1px solid var(--line);background:var(--sur)}
.acch{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;cursor:pointer;min-height:52px}
.acch span{font:600 11px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.acch i{font:400 20px/1 var(--body);color:var(--acc);font-style:normal}
.acc.open .acch span{color:var(--accfg)}
.accb{padding:0 22px 18px}
.accb p{margin:0;font:400 15px/1.55 var(--body);color:#B5BABD;text-wrap:pretty}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;
  border-top:1px solid var(--line);cursor:pointer;min-height:44px}
.vrow span{font:500 15px/1.25 var(--body);color:var(--fg2)}
.vrow i{flex:none;font:500 10px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--dim3);font-style:normal}
.back{position:absolute;left:16px;top:calc(var(--top) + 12px);width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:rgba(14,15,17,.72);border:1px solid var(--line2);color:#E8EAEB;font:600 17px/1 var(--body);cursor:pointer;z-index:2}
.hmeta{position:absolute;left:0;right:0;bottom:0;padding:56px 16px 14px;z-index:3;
  background:linear-gradient(0deg,rgba(10,11,12,.96) 0%,rgba(10,11,12,.74) 46%,transparent 100%)}
.hname{font:700 28px/1.02 var(--cond);text-transform:uppercase;color:#F6F7F8}
.hsub{font:500 11px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-top:8px}

.dtabs{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.dt{flex:1;background:#101215;padding:15px 8px;text-align:center;cursor:pointer;min-height:50px;
  font:700 14px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.dt.on{background:var(--sur);color:var(--accfg);box-shadow:inset 0 -2px 0 var(--acc)}

.dockbar{flex:none;padding:10px 20px calc(var(--bot) + 14px);background:rgba(14,15,17,.96);
  border-top:1px solid var(--line);backdrop-filter:blur(20px)}
.spacer{height:8px}

.tipbox{margin:16px 22px 0;padding:14px 16px;border:1px solid #3A3520;background:#191710;border-left:3px solid #C9A227}
.tipbox.alt{border-color:#1E3A38;background:#0F1A19;border-left-color:#4FD1C5}
.tipbox i{display:block;font:600 10px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:#D9B23A;font-style:normal}
.tipbox.alt i{color:#4FD1C5}
.tipbox p{margin:8px 0 0;font:400 15px/1.55 var(--body);color:#C4C8CB;text-wrap:pretty}

.prrow{display:flex;gap:1px;background:var(--line);margin:16px 22px 0;border:1px solid var(--line)}
.prcell{flex:1;background:#1A1810;padding:13px 14px}
.prcell i{display:block;font:600 10px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:#D9B23A;font-style:normal}
.prcell b{display:block;font:700 26px/1 var(--cond);color:var(--fg);margin-top:7px}
.prcell u{display:block;font:500 11px/1 var(--mono);color:var(--dim2);margin-top:6px;text-decoration:none}

.block{background:var(--sur);border-bottom:1px solid var(--line);padding:18px 22px 20px}
.block.edge{margin:20px 22px 0;border:1px solid #24282B;padding:0}
.blockhead{display:flex;align-items:baseline;justify-content:space-between;
  font:600 11px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--dim2)}
.stepper{display:flex;align-items:center;gap:14px;margin-top:14px}
.sbtn{flex:none;width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:#1B1E21;
  border:1px solid var(--line2);color:#E8EAEB;font:600 24px/1 var(--body);cursor:pointer}
.sbtn:active{border-color:var(--acc)}
.sbtn.sm{width:40px;height:40px;font-size:19px;background:none}
.sval{flex:1;text-align:center}
.sval>div:first-child{display:flex;align-items:baseline;justify-content:center;gap:8px}
.sval b{font:700 52px/.9 var(--cond)}
.sval i{font:600 12px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);font-style:normal}
.skg{font:700 22px/1 var(--cond);color:var(--acc);margin-top:7px}
.ladder{display:flex;gap:2px;margin-top:16px;align-items:flex-end;height:34px}
.lb{flex:1;background:#22262A;cursor:pointer}.lb.on{background:var(--acc)}
.lrange{display:flex;justify-content:space-between;margin-top:6px;font:500 10px/1 var(--mono);color:var(--dim3)}

.duo{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.duo.tight{margin:18px 20px 0;border:1px solid var(--line)}
.dcell{flex:1;background:var(--sur);padding:13px 16px}
.dcell.ctr{text-align:center;padding:14px 12px}
.dcell i{display:block;font:500 10px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:#5F6569;font-style:normal}
.dcell b{display:block;font:600 15px/1 var(--body);color:var(--fg2);margin-top:6px}
.dcell u{display:block;font:600 13px/1 var(--mono);color:var(--acc);margin-top:10px;text-decoration:none}
.dcell u.dim{color:var(--dim2)}
.mini{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:9px}
.mini b{font:700 34px/1 var(--cond);min-width:34px}

.steps{padding:20px 22px 0}
.step{display:flex;gap:14px;padding-bottom:18px}
.step>span{flex:none;width:26px;font:700 13px/1.4 var(--mono);color:var(--acc)}
.step i{font:600 11px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-style:normal}
.step p{font:400 15px/1.5 var(--body);color:#B5BABD;margin:6px 0 0;text-wrap:pretty}
.hint{margin:18px 22px;padding:14px 16px;border:1px solid #24282B;background:var(--sur);
  font:400 14px/1.5 var(--body);color:var(--dim);text-wrap:pretty}
.fine{font:400 12px/1.5 var(--body);color:#5F6569;text-wrap:pretty}

.chart{display:flex;align-items:flex-end;gap:6px;height:82px;margin-top:14px}
.cbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.cbar b{font:600 11px/1 var(--mono);color:var(--dim2)}
.cbar div{width:100%;background:#2B3034}.cbar div.on{background:var(--acc)}
.cbar i{font:500 9px/1 var(--mono);color:var(--dim3);font-style:normal}
.bodymap{margin:2px 22px 0;padding:14px 10px 6px;border:1px solid #24282B;background:var(--sur);border-bottom:0}
.bodylegend{display:flex;align-items:center;gap:14px;padding:0 22px;margin-top:-2px}
.bodylegend span{display:flex;align-items:center;gap:6px;font:500 11px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.bodylegend i{width:12px;height:8px;background:#1F2429}
.bodylegend i.mid{background:#3B6BE8;opacity:.45}
.bodylegend i.on{background:#3B6BE8}
.bodymap svg{width:100%;height:auto;display:block}
.bodyblock{display:flex;gap:16px;align-items:flex-start;margin:0 22px 0;padding:14px;
  border:1px solid #24282B;background:var(--sur)}
.mvols{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding-top:4px}
.mvols.tight{gap:8px;padding:0 0 14px}
.mvol{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.mvol>span{grid-column:1;font:500 12px/1.2 var(--body);color:var(--fg2);min-width:0}
.mvol b{grid-column:2;text-align:right;white-space:nowrap;font:600 11px/1 var(--mono);color:var(--fg2)}
.mvol i{grid-column:1;height:6px;background:#1A1D20;position:relative;min-width:40px}
.mvol u{position:absolute;left:0;top:0;bottom:0;background:var(--acc);text-decoration:none}
.mvol em{grid-column:2;text-align:right;white-space:nowrap;font:400 11px/1 var(--mono);color:var(--dim);font-style:normal}
.mvol u.low{background:#D9963A}
.mvol u.high{background:#C2492E}

.ppbox{margin:2px 22px 0;padding:14px;border:1px solid #24282B;background:var(--sur)}
.ppbar{height:10px;background:#2B3034;position:relative;overflow:hidden}
.ppbar u{position:absolute;left:0;top:0;bottom:0;background:var(--acc);text-decoration:none}
.pplab{display:flex;justify-content:space-between;margin-top:9px}
.pplab b{font:600 12px/1 var(--mono);color:var(--dim)}
.pplab b:first-child{color:var(--acc)}
.ppbox p{margin:11px 0 0;font:400 13px/1.45 var(--body);color:var(--dim);text-wrap:pretty}
.ppbox p.warn{color:#E0BC8A}

.sess{margin:0 22px 8px;border:1px solid #24282B;background:var(--sur)}
.sess.open{border-color:var(--acc)}
.sessh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;cursor:pointer;min-height:56px}
.sessd b{display:block;font:600 15px/1 var(--body);color:var(--fg2)}
.sessd i{display:block;font:500 11px/1 var(--mono);color:var(--dim2);margin-top:6px;font-style:normal}
.sessv{text-align:right}
.sessv b{display:block;font:700 19px/1 var(--cond);color:var(--acc)}
.sessv i{display:block;font:500 10px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--dim3);margin-top:5px;font-style:normal}
.sessb{padding:14px 14px 4px;border-top:1px solid var(--line)}
.sexblock{border-top:1px solid var(--line);padding:4px 0}
.sexrow{display:flex;align-items:center;gap:10px;padding:9px 0;min-height:44px}
.sexrow>span:first-child{flex:1;font:500 14px/1.25 var(--body);color:var(--fg2);cursor:pointer}
.sexrow i{flex:none;font:500 11px/1 var(--mono);color:var(--acc);font-style:normal}
.setline{display:flex;align-items:center;gap:10px;padding:7px 0 7px 12px;min-height:40px;
  border-left:1px solid var(--line);margin-left:2px}
.setline .mono{width:46px;color:var(--dim3)}
.setline b{flex:1;font:600 14px/1 var(--mono);color:var(--fg2)}
.setline u{font:500 11px/1 var(--mono);color:var(--dim2);text-decoration:none}
.del{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none;
  color:var(--dim3);cursor:pointer;font:400 13px/1 var(--body)}
.del:active{color:#E86A4B}
.ghost.danger{border-color:#3A2422;color:#D98070;margin:12px 0 4px}
.ghost.danger:active{border-color:#E86A4B;color:#E86A4B}

.ask{position:fixed;inset:0;background:rgba(8,9,10,.86);display:flex;align-items:flex-start;justify-content:center;
