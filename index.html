<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EISENHORN">
<meta name="theme-color" content="#101112">
<title>EISENHORN Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#101112; --sur:#17191A; --sur2:#1C1E20; --line:#25282A; --line2:#33373A;
  --fg:#F2F3F3; --fg2:#DEE1E2; --dim:#A5ABAE; --dim2:#969C9F; --dim3:#7F8689;
  --acc:#E8551F; --accfg:#FFF3EE; --up:#8FB0C4;
  --accsoft:#2E1B12;
  --tint-gold:#1A1810; --tint-teal:#101A19; --tint-olive:#17160F; --tint-violet:#16101F;
  --tint-amber:#1A150C; --tint-red:#2A1A18; --tint-red2:#3A2422;
  --edge-gold:#3A3520; --edge-teal:#1E3A38; --edge-amber:#4A3A20;
  --ink-gold:#D9B23A; --ink-amber:#E0BC8A; --ink-olive:#B39B5E; --ink-violet:#B48BE8;
  --veil:rgba(14,15,17,.72); --veil2:rgba(14,15,17,.96); --scrim:rgba(8,9,10,.86);
  --acc-ink:var(--accfg); --acc-hover:#F26B36; --ink-warn:#E8A33B; --ink-red:#E86A4B;
  --edge-gold2:#C9A227; --edge-amber2:#D9963A; --edge-olive:#8A7A4E; --edge-violet:#9A6BD9;
  --fig-fill:#15181B; --fig-edge:#3A4147; --fig-rest:#1F2429; --fig-line:#2A3035; --fig-label:#8A9095;
  --cond:'Barlow Condensed','Helvetica Neue Condensed','Arial Narrow',system-ui,sans-serif;
  --body:Barlow,'Helvetica Neue',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
}
:root{--ts:1}
/* Systemschrift größer gestellt? Der Regler im Profil skaliert die ganze
   Oberfläche, damit Tippflächen und Abstände mitwachsen. */
#app{zoom:var(--ts)}
@media (prefers-color-scheme:light){
  :root:not([data-theme=dark]){
    --bg:#EEEFF0; --sur:#FFFFFF; --sur2:#F8F9F9; --line:#DCDEE0; --line2:#C3C7C9;
    --fg:#141618; --fg2:#2C3033; --dim:#54595C; --dim2:#5D6265; --dim3:#6A6F72;
    --acc:#A93A0C; --accfg:#FFFFFF; --up:#2F5E77;
    --accsoft:#F7E3D9;
    --tint-gold:#FBF6E4; --tint-teal:#E6F4F2; --tint-olive:#F7F4E8; --tint-violet:#F1EBFA;
    --tint-amber:#FBF1E2; --tint-red:#FBEBE7; --tint-red2:#F7DED8;
    --edge-gold:#D8C88C; --edge-teal:#9FCFC9; --edge-amber:#DCBE8E;
    --ink-gold:#6E5410; --ink-amber:#7A5314; --ink-olive:#5E5220; --ink-violet:#4F2E8C;
    --veil:rgba(255,255,255,.82); --veil2:rgba(245,246,247,.96); --scrim:rgba(30,33,36,.5);
    --acc-ink:#8E2F08; --acc-hover:#8E2F08; --ink-warn:#7A4A08; --ink-red:#9E2B12;
    --edge-gold2:#B08D12; --edge-amber2:#B06A14; --edge-olive:#7A6A3A; --edge-violet:#6B3FC0;
    --fig-fill:#EDEFF1; --fig-edge:#A8AEB3; --fig-rest:#DCDFE2; --fig-line:#B8BDC1; --fig-label:#5E6367;
  }
}
:root[data-theme=light]{
  --bg:#EEEFF0; --sur:#FFFFFF; --sur2:#F8F9F9; --line:#DCDEE0; --line2:#C3C7C9;
  --fg:#141618; --fg2:#2C3033; --dim:#54595C; --dim2:#5D6265; --dim3:#6A6F72;
  --acc:#A93A0C; --accfg:#FFFFFF; --up:#2F5E77;
  --accsoft:#F7E3D9;
  --tint-gold:#FBF6E4; --tint-teal:#E6F4F2; --tint-olive:#F7F4E8; --tint-violet:#F1EBFA;
  --tint-amber:#FBF1E2; --tint-red:#FBEBE7; --tint-red2:#F7DED8;
  --edge-gold:#D8C88C; --edge-teal:#9FCFC9; --edge-amber:#DCBE8E;
  --ink-gold:#6E5410; --ink-amber:#7A5314; --ink-olive:#5E5220; --ink-violet:#4F2E8C;
  --veil:rgba(255,255,255,.82); --veil2:rgba(245,246,247,.96); --scrim:rgba(30,33,36,.5);
  --acc-ink:#8E2F08; --acc-hover:#8E2F08; --ink-warn:#7A4A08; --ink-red:#9E2B12;
  --edge-gold2:#B08D12; --edge-amber2:#B06A14; --edge-olive:#7A6A3A; --edge-violet:#6B3FC0;
  --fig-fill:#EDEFF1; --fig-edge:#A8AEB3; --fig-rest:#DCDFE2; --fig-line:#B8BDC1; --fig-label:#5E6367;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{color:var(--acc-hover)}
[data-a]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[data-a]{transition:background .16s ease,border-color .16s ease,color .16s ease}
.scroll,.wbody{scroll-behavior:smooth}
.ask,.rest{animation:fadein .2s ease both}
.askbox,.rin{animation:rise .26s cubic-bezier(.32,.72,0,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media (max-width:540px){#app{border:0}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--top) + 14px) 0 calc(var(--bot) + 96px)}
.pad{padding:0 22px}.pad2{padding:18px 16px 16px}

.eyebrow{font:600 11px/1 var(--cond);letter-spacing:.24em;text-transform:uppercase;color:var(--dim2)}
.hero{font:700 52px/.9 var(--cond);text-transform:uppercase;margin:10px 0 0;letter-spacing:-.015em}
.h1{font:700 34px/1 var(--cond);text-transform:uppercase;margin:0}
.titlerow{display:flex;align-items:baseline;justify-content:space-between}
.lead{font:400 14px/1.45 var(--body);color:var(--dim);margin:8px 0 0}
.mono{font:500 11px/1 var(--mono);color:var(--dim2)}.dim{color:var(--dim2)}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;padding:34px 22px 11px;
  font:600 11px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--dim2)}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);margin:22px 22px 0;border:1px solid var(--line)}
.stats.two{grid-template-columns:1fr 1fr;margin-top:16px}
.stat{background:var(--sur);padding:12px}
.stat b{display:block;font:700 36px/.92 var(--cond);letter-spacing:-.01em}.stat b.hl{color:var(--acc)}
.stat i{display:block;font:500 11px/1.2 var(--body);color:var(--dim2);margin-top:6px;font-style:normal}

.seg3{display:flex;gap:1px;background:var(--line);margin:0 22px;border:1px solid var(--line)}
.seg3.flat{margin:0 0 2px}
.s3{flex:1;background:var(--sur);padding:12px 6px;text-align:center;cursor:pointer;min-height:48px}
.s3.on{background:var(--accsoft)}
.s3 b{display:block;font:700 15px/1.05 var(--body);color:var(--dim)}
.s3.on b{color:var(--acc-ink)}
.s3 i{display:block;font:500 11px/1.05 var(--body);color:var(--dim3);margin-top:6px;font-style:normal}
.s3.on i{color:var(--acc)}

.card{margin:14px 22px 0;border:1px solid var(--line2);background:var(--sur2)}
.cardtop{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.dot{width:6px;height:6px;background:var(--acc);border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.tag{font:600 10px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.ml{margin-left:auto}
.ctitle{padding:10px 18px 0;font:700 32px/1 var(--cond);text-transform:uppercase;letter-spacing:-.01em}
.csub{padding:6px 16px 0;font:400 14px/1.45 var(--body);color:var(--dim)}
.plan{display:flex;flex-direction:column;gap:1px;margin-top:14px;background:var(--line2)}
.prow{display:flex;align-items:center;gap:12px;background:var(--sur);padding:12px 16px;cursor:pointer;min-height:44px}
.num{font:600 11px/1 var(--mono);color:var(--dim3);width:22px}
.pname{flex:1;font:500 15px/1.2 var(--body);color:var(--fg2)}
.pload{font:700 15px/1 var(--cond);letter-spacing:0;color:var(--acc);white-space:nowrap}

.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--acc);color:var(--accfg);
  min-height:54px;padding:16px 18px;cursor:pointer;font:600 17px/1.15 var(--body);letter-spacing:.01em}
.cta:active{background:var(--acc-hover)}
.ghost{display:flex;align-items:center;justify-content:center;min-height:50px;border:1px solid var(--line2);
  color:var(--fg2);cursor:pointer;font:600 15px/1.2 var(--body);letter-spacing:.01em;margin:14px 0;text-align:center;padding:0 12px}

.hscroll{display:flex;gap:10px;padding:0 22px;overflow-x:auto}
.gcard{flex:none;width:150px;background:var(--sur);padding:14px;cursor:pointer}
.gname{font:500 13px/1.25 var(--body);color:var(--fg2);height:34px;overflow:hidden}
.grow{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.grow b{font:700 22px/1 var(--cond)}
.grow i{font:600 12px/1.05 var(--body);color:var(--dim2);font-style:normal}
.grow u{margin-left:auto;font:600 12px/1 var(--body);color:var(--up);text-decoration:none}
.gkg{font:500 12px/1 var(--mono);color:var(--acc);margin-top:6px}

.search{display:flex;align-items:center;gap:9px;margin-top:12px;background:var(--sur2);border:1px solid var(--line2);padding:0 12px;height:46px}
.search span{color:var(--dim2)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:400 16px/1 var(--body);height:46px}
.rfilter{display:flex;gap:6px;margin-top:11px}
.rc{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;padding:10px 6px;text-align:center;
  border:1px solid var(--line2);color:var(--dim);cursor:pointer;
  font:600 11px/1.15 var(--cond);letter-spacing:.08em;text-transform:uppercase}
.rc.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc-ink)}
.chips{display:flex;gap:7px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:44px;display:flex;align-items:center;padding:8px 14px;border:1px solid var(--line2);
  color:var(--dim);cursor:pointer;font:600 11px/1 var(--cond);letter-spacing:.13em;text-transform:uppercase}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg)}

.list{margin-top:14px}
.erow{display:flex;gap:13px;padding:11px 22px;cursor:pointer;border-bottom:1px solid var(--line);align-items:center;min-height:60px}
.thumb svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.minimap{flex:none;width:48px;height:64px;background:var(--sur2)}
.minimap svg{width:100%;height:100%;display:block}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.thumb{flex:none;width:60px;height:60px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(115deg,var(--sur2) 0 6px,var(--line) 6px 12px)}
.scan{position:absolute;left:0;right:0;height:26px;background:linear-gradient(180deg,transparent,rgba(59,107,232,.18),transparent);animation:scan 3.4s linear infinite}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(400%)}}
.ebody{flex:1;min-width:0}
.ename{font:500 16px/1.2 var(--body);color:var(--fg2)}
.dsflag{font:600 9px/1 var(--mono);color:var(--acc);border:1px solid var(--acc);padding:2px 4px;vertical-align:middle}
.emeta{font:500 13px/1.05 var(--body);color:var(--dim2);margin-top:6px}
.eright{text-align:right;flex:none}
.eright b{display:block;font:700 24px/1 var(--cond);color:var(--acc);white-space:nowrap}
.eright i{display:block;font:500 10px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin-top:4px;font-style:normal}
.eright i.up{color:var(--up);font-size:12px;letter-spacing:0}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;width:64px}
.spark div{flex:1;background:var(--line2)}.spark div.on{background:var(--acc)}

.hero-media{position:relative}
.media{position:relative;overflow:hidden;background:repeating-linear-gradient(115deg,var(--sur2) 0 9px,var(--line) 9px 18px);border-bottom:1px solid var(--line2)}
.media img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2}
.media.novid img{display:none}
.media .schema,.media .mlabel{display:none}
.media.novid .schema{display:block;position:absolute;inset:0;padding:10px}
.media.novid .schema svg{width:100%;height:100%}
.media.novid .mlabel{display:block;position:absolute;right:12px;top:12px;z-index:4;
  font:600 9px/1 var(--mono);color:var(--dim3);letter-spacing:.14em;text-transform:uppercase}
.sl{animation:sl 2.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sl{0%,8%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}
.sl.rot{transform-origin:26px 101px;animation:slr 2.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes slr{0%,8%{transform:rotate(0)}50%{transform:rotate(-26deg)}92%,100%{transform:rotate(0)}}

.skala{margin-top:16px;display:flex;flex-direction:column;gap:1px;background:var(--line)}
.srow{display:flex;align-items:center;gap:12px;background:var(--sur);padding:12px 14px;min-height:48px}
.srow .mname{flex:1;min-width:0;font:600 16px/1.2 var(--body);color:var(--fg2)}
.srow .pips{flex:none;display:flex;gap:4px}
.srow .pip{width:9px;height:9px;background:var(--line2);border-radius:50%}
.srow .pip.on{background:var(--acc)}
.srow .rank{flex:none;width:26px;text-align:right;font:600 11px/1 var(--mono);color:var(--dim3)}
.srclink{display:block;margin-top:12px;font:500 12px/1 var(--body)}
.mset{display:flex;gap:3px;margin-top:7px}
.mset span{height:3px;background:var(--line2)}
.mset span:first-child{background:var(--acc)}

.acc{border-bottom:1px solid var(--line);background:var(--sur)}
.acch{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;cursor:pointer;min-height:52px}
.acch span{font:600 11px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.acch i{font:400 20px/1 var(--body);color:var(--acc);font-style:normal}
.acc.open .acch span{color:var(--acc-ink)}
.accb{padding:0 22px 18px}
.accb p{margin:0;font:400 15px/1.55 var(--body);color:var(--fg2);text-wrap:pretty}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;
  border-top:1px solid var(--line);cursor:pointer;min-height:44px}
.vrow span{font:500 15px/1.25 var(--body);color:var(--fg2)}
.vrow i{flex:none;font:500 11px/1.05 var(--body);color:var(--dim3);font-style:normal}
.back{position:absolute;left:16px;top:calc(var(--top) + 12px);width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:var(--veil);border:1px solid var(--line2);color:var(--fg);font:600 17px/1 var(--body);cursor:pointer;z-index:2}
.hmeta{position:absolute;left:0;right:0;bottom:0;padding:56px 16px 14px;z-index:3;
  background:linear-gradient(0deg,rgba(10,11,12,.96) 0%,rgba(10,11,12,.74) 46%,transparent 100%)}
.hname{font:700 28px/1.02 var(--cond);text-transform:uppercase;color:var(--fg)}
.hsub{font:500 11px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-top:8px}

.dtabs{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.dt{flex:1;background:var(--sur);padding:15px 8px;text-align:center;cursor:pointer;min-height:50px;
  font:700 15px/1.05 var(--body);color:var(--dim2)}
.dt.on{background:var(--sur);color:var(--acc-ink);box-shadow:inset 0 -2px 0 var(--acc)}

.dockbar{flex:none;padding:10px 20px calc(var(--bot) + 14px);background:var(--veil2);
  border-top:1px solid var(--line);backdrop-filter:blur(20px)}
.spacer{height:8px}

.tipbox{margin:16px 22px 0;padding:14px 16px;border:1px solid var(--edge-gold);background:var(--tint-gold);border-left:3px solid var(--edge-gold2)}
.tipbox.alt{border-color:var(--edge-teal);background:var(--tint-teal);border-left-color:var(--up)}
.tipbox i{display:block;font:600 10px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-gold);font-style:normal}
.tipbox.alt i{color:var(--up)}
.tipbox p{margin:8px 0 0;font:400 15px/1.55 var(--body);color:var(--fg2);text-wrap:pretty}

.prrow{display:flex;gap:1px;background:var(--line);margin:18px 22px 0}
.prcell{flex:1;background:var(--tint-gold);padding:13px 14px}
.prcell i{display:block;font:600 11px/1.05 var(--body);color:var(--ink-gold);font-style:normal}
.prcell b{display:block;font:700 38px/.92 var(--cond);color:var(--fg);margin-top:8px}
.prcell u{display:block;font:500 11px/1 var(--mono);color:var(--dim2);margin-top:6px;text-decoration:none}

.block{background:var(--sur);border-bottom:1px solid var(--line);padding:18px 22px 20px}
.block.edge{margin:20px 22px 0;border:1px solid var(--line2);padding:0}
.blockhead{display:flex;align-items:baseline;justify-content:space-between;
  font:600 12px/1.05 var(--body);color:var(--dim2)}
.stepper{display:flex;align-items:center;gap:14px;margin-top:14px}
.sbtn{flex:none;width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:var(--sur2);
  border:1px solid var(--line2);color:var(--fg);font:600 24px/1 var(--body);cursor:pointer}
.sbtn:active{border-color:var(--acc)}
.sbtn.sm{width:40px;height:40px;font-size:19px;background:none}
.sval{flex:1;text-align:center}
.sval>div:first-child{display:flex;align-items:baseline;justify-content:center;gap:8px}
.sval b{font:700 52px/.9 var(--cond)}
.sval i{font:600 13px/1.05 var(--body);color:var(--dim2);font-style:normal}
.skg{font:700 30px/1 var(--cond);color:var(--acc);margin-top:8px}
.ladder{display:flex;gap:2px;margin-top:16px;align-items:flex-end;height:34px}
.lb{flex:1;background:var(--line2);cursor:pointer}.lb.on{background:var(--acc)}
.lrange{display:flex;justify-content:space-between;margin-top:6px;font:500 10px/1 var(--mono);color:var(--dim3)}

.duo{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.duo.tight{margin:18px 20px 0;border:1px solid var(--line)}
.dcell{flex:1;background:var(--sur);padding:13px 16px}
.dcell.ctr{text-align:center;padding:14px 12px}
.dcell i{display:block;font:500 11px/1.05 var(--body);color:var(--dim2);font-style:normal}
.dcell b{display:block;font:600 15px/1 var(--body);color:var(--fg2);margin-top:6px}
.dcell u{display:block;font:700 18px/1 var(--cond);color:var(--acc);margin-top:10px;text-decoration:none}
.dcell u.dim{color:var(--dim2)}
.mini{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:9px}
.mini b{font:700 34px/1 var(--cond);min-width:34px}

.steps{padding:20px 22px 0}
.step{display:flex;gap:14px;padding-bottom:18px}
.step>span{flex:none;width:26px;font:700 13px/1.4 var(--mono);color:var(--acc)}
.step i{font:600 11px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-style:normal}
.step p{font:400 15px/1.5 var(--body);color:var(--fg2);margin:6px 0 0;text-wrap:pretty}

.ringwrap.plain{width:auto;height:auto;margin-top:18px}
.blank{margin:22px 22px;padding:28px 20px 26px;background:var(--sur);border-left:3px solid var(--line2)}
.blank u{display:block;font:700 56px/.85 var(--cond);color:var(--line2);text-decoration:none}
.blank b{display:block;margin-top:14px;font:700 22px/1.1 var(--cond);text-transform:uppercase;color:var(--fg)}
.blank span{display:block;margin-top:8px;font:400 14px/1.5 var(--body);color:var(--dim)}
.turnbar{margin:12px 20px 0;padding:12px 14px;border:1px solid var(--acc);background:var(--sur2)}
.turnbar b{display:block;font:600 14px/1.2 var(--cond);color:var(--acc);letter-spacing:.04em}
.turnbar i{display:block;margin-top:5px;font:400 12px/1.45 var(--body);color:var(--dim2);font-style:normal}

.repin{width:66px;height:42px;background:var(--bg);border:1px solid var(--line2);color:var(--fg);
  font:700 22px/1 var(--cond);text-align:center;outline:0;-moz-appearance:textfield}
.repin:focus{border-color:var(--acc)}
.repin::-webkit-outer-spin-button,.repin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set .tagr{width:42px;text-align:right}
.set.ok .tagr{cursor:pointer;font-size:15px;color:var(--dim2)}
.set .mono{width:44px}
.tagr{font:600 12px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.set.ok .tagr{color:var(--up)}
.wfoot{flex:none;padding:0 20px calc(var(--bot) + 20px)}

.rest{position:fixed;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--top) + 30px) 30px calc(var(--bot) + 24px);z-index:40}
.rest>*:not(.restfill){position:relative;z-index:1}
.restfill{position:fixed;left:0;right:0;bottom:0;background:var(--accsoft);
  border-top:2px solid var(--acc);transition:height 1s linear;z-index:0;pointer-events:none}
.rest>i{font:600 11px/1 var(--cond);letter-spacing:.26em;text-transform:uppercase;color:var(--acc);font-style:normal}
.ringwrap{position:relative;width:216px;height:216px;margin-top:26px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;inset:0;border-radius:50%;
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  mask:radial-gradient(closest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
.rin{position:relative;text-align:center}
.rin b{display:block;font:700 clamp(92px,32vw,180px)/.82 var(--cond);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rin span{display:block;margin-top:10px;font:500 14px/1.3 var(--body);color:var(--dim);text-align:center}
.next{margin-top:30px;text-align:center}
.next i{font:500 10px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);font-style:normal}
.next b{display:block;font:700 24px/1.1 var(--cond);text-transform:uppercase;color:var(--fg2);margin-top:9px}
.next u{display:block;font:600 13px/1 var(--mono);color:var(--acc);margin-top:9px;text-decoration:none}
.rbtns{display:flex;gap:10px;margin-top:40px;width:100%;max-width:360px}
.rbtns>*{flex:1;margin:0}
.restcfg{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;
  font:500 12px/1 var(--body);color:var(--dim)}
.restcfg span{padding:11px 13px;border:1px solid var(--line2);color:var(--fg2);cursor:pointer;min-height:40px;
  display:flex;align-items:center;font:600 11px/1 var(--cond);letter-spacing:.1em}
.restcfg b{font:700 18px/1 var(--cond);color:var(--fg)}
/* Im Fluss statt am Bildschirmrand — sonst liegt die Zeile auf den Tasten. */
.rest>.sheethint.flow{position:static;bottom:auto;margin-top:10px;font-size:11px}

.cfg{display:flex;flex-direction:column;gap:1px;margin-top:14px;background:var(--line);border:1px solid var(--line)}
.cfgrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sur);padding:8px 14px;min-height:56px}
.cfgrow>span{font:500 14px/1.2 var(--body);color:var(--fg2)}
.cfgrow .mini{margin-top:0;gap:8px}
.cfgrow .mini b{font:700 24px/1 var(--cond);min-width:56px;text-align:center}

.toast{position:fixed;left:20px;right:20px;max-width:480px;margin:0 auto;bottom:calc(var(--bot) + 96px);background:var(--acc);color:var(--accfg);
  padding:14px 16px;font:600 14px/1.3 var(--body);z-index:90}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
